<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioceramic stick scene</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #fff; font-family: system-ui, sans-serif; color: #141414; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #737373; font-size: 14px; }
  .frame { border: 1px solid #e3e3e3; border-radius: 14px; overflow: hidden;
    background: #fff radial-gradient(#e6e6e6 1px, transparent 1.2px) 0 0 / 14px 14px; }
  stick-scene { display: block; height: 300px; width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Perforation repair</h1>
  <p>Plays when scrolled into view; click it to play again.</p>
  <div class="frame">
    <stick-scene scene="bioceramic-perforation" play="view"></stick-scene>
  </div>
</main>
<script src="stick.js" defer></script>
<script src="bioceramic-perforation.js" defer></script>
</body>
</html>
